name: feed

on:
  schedule:
    - cron: "17 */3 * * *"      # svaka 3h (UTC); :17 jer je GitHub-ov cron u pun sat zagušen
  workflow_dispatch:

permissions:
  contents: write

concurrency: feed

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prethodno stanje sa gh-pages
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C site
          fi

      - name: Sažeci
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python vesti.py

      - name: Objavi na gh-pages (uvek jedan commit, bez istorije)
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "feed $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
